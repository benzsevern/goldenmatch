# paths-filter definitions for .github/workflows/ci.yml (the `changes` job).
# Extracted from ci.yml's inline `filters:` block to shrink that monolith's
# add-heavy conflict surface: two PRs each adding a lane now conflict here in a
# small dedicated file instead of deep inside ci.yml. dorny/paths-filter loads
# this via `filters: .github/filters.yml`. Per-path globs are unanchored --
# `'foo/**'` matches at any depth. Adding a lane still means: a filter entry
# HERE + the matching `changes.outputs.*` line + the job's `if:` gate in ci.yml.
ci_workflow:
  - '.github/workflows/ci.yml'
  # #1846: workflow_lint validates path-filter COVERAGE, so an edit to the
  # filters themselves (or to the checker) must run it. Without this, the one
  # file the coverage check exists to validate was the one file that couldn't
  # trigger it -- the same "a filter can't catch what it doesn't list" hole,
  # one level up.
  - '.github/filters.yml'
  - 'scripts/check_filter_coverage.py'
# Every workflow file, for the YAML validation half of `workflow_lint`. Kept
# SEPARATE from ci_workflow on purpose: ci_workflow also drives `force_all` in
# the merge queue, so widening it would make any workflow edit re-run the whole
# matrix. This one only decides whether the lint runs. Before it existed the
# lint was gated on ci_workflow's three paths, so ~115 of the repo's workflow
# files could be edited with no YAML validation at all -- a check that existed
# and did not fire.
any_workflow:
  - '.github/workflows/**'
  - '.github/filters.yml'
  - 'scripts/check_workflow_yaml.py'
  - 'scripts/check_filter_coverage.py'
# Agent-context docs: the CLAUDE.md files plus the operations notes the root file
# links to. Its own filter rather than folding into `docs` so a CLAUDE.md edit runs
# the cheap ref check without also triggering the 8-minute Mintlify render.
claude_refs:
  - '**/CLAUDE.md'
  - 'context-network/operations/**'
  - 'packages/python/goldenmatch/docs/context/**'
  - 'scripts/check_claude_refs.py'
  - 'scripts/test_claude_refs.py'
  - 'scripts/check_context_budget.py'
  - 'scripts/check_commit_msg.py'
  - 'scripts/test_context_and_commit_gates.py'
# scripts/ is ~100 files including 24 check_*.py gates that ci-required depends
# on, and NOTHING linted it: the python matrix runs `ruff check
# packages/python/<pkg>`, which never reaches here. So the repo's own ruff config
# (F/I/B/UP) was enforced everywhere except the directory enforcing everything
# else. Found via a code-quality bot flagging an unused import CI could not have
# caught (#2449).
scripts_lint:
  - 'scripts/**'
  - 'pyproject.toml'
python_root:
  - 'pyproject.toml'
  - 'uv.lock'
python_goldenmatch:
  - 'packages/python/goldenmatch/**'
  # Stage A: the standalone datafusion-ffi UDF crate is built into
  # the goldenmatch venv in the `python` lane and exercised by
  # tests/test_datafusion_ffi_udf.py. A crate-only change must
  # re-trigger that lane so the FFI feasibility gate re-runs.
  - 'packages/rust/extensions/datafusion-udf/**'
  # Stage B: the FFI scorer UDFs delegate to the shared score-core
  # crate. A score-core-only change must re-trigger this lane so the
  # FFI scorer-parity test (vs native) re-runs.
  - 'packages/rust/extensions/score-core/**'
  # The FFI record-fingerprint UDF delegates to fingerprint-core; a
  # fingerprint-core-only change must re-trigger this lane so the
  # cross-surface fingerprint-golden parity test re-runs.
  - 'packages/rust/extensions/fingerprint-core/**'
python_goldenmatch_postgres:
  - 'packages/python/goldenmatch/tests/test_db.py'
  - 'packages/python/goldenmatch/tests/test_reconcile.py'
  - 'packages/python/goldenmatch/tests/test_memory_store_postgres.py'
  - 'packages/python/goldenmatch/tests/identity/test_store_pg_lookup_2893.py'
  - 'packages/python/goldenmatch/tests/_pg_helpers.py'
  - 'packages/python/goldenmatch/goldenmatch/db/**'
  - 'packages/python/goldenmatch/goldenmatch/core/memory/**'
  # The identity store carries a full Postgres backend (IdentityStore
  # backend="postgres"), and this lane is the only place a real Postgres
  # exercises it -- but `identity/**` was absent here, so an edit to that
  # backend triggered NO Postgres coverage at PR time. Found while fixing
  # #2893, which is a postgres-only change inside identity/store.py.
  - 'packages/python/goldenmatch/goldenmatch/identity/**'
# #1086 throughput-tier perf gate: re-run when the tier code or the
# bench harness changes (so a regression in the sketch-then-verify
# cost is caught), and on ci.yml edits (keeps the gate logic tested).
throughput:
  - 'packages/python/goldenmatch/goldenmatch/core/throughput_verify.py'
  - 'packages/python/goldenmatch/goldenmatch/core/autoconfig_planner.py'
  - 'packages/python/goldenmatch/goldenmatch/config/schemas.py'
  - 'scripts/bench_corpus_dedup/**'
  # The gate now builds + runs the native bit-parallel scoring kernel for the
  # controller's fuzzy profiling pass, so a change to the scoring cores (or the
  # pyo3 wrapper) must re-run it -- a kernel regression there is exactly what
  # would re-slow (or drift) the profiling.
  - 'packages/rust/extensions/goldenfuzz-core/**'
  - 'packages/rust/extensions/score-core/**'
  - 'packages/rust/extensions/native/**'
  - 'packages/python/goldenmatch/goldenmatch/core/strsim.py'
  - '.github/workflows/ci.yml'
python_goldencheck:
  - 'packages/python/goldencheck/**'
python_goldenflow:
